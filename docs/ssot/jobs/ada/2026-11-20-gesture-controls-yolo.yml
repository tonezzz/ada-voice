title: >-
  Desk-companion gesture controls on the YOLO pose stream — wave arms,
  swipe navigates kiosk panels, palm-hold opens settings, drop dismisses
subtitle: >-
  GestureService rides the existing shared pose pipeline
  (CameraHub -> PoseService.results(), Hailo yolov8s_pose / MoveNet
  fallback) instead of a competing capture loop. Exposed via
  /ws/gesture + GET/PATCH /api/gestures + the gesture_controls tools.d
  tool on the ada-ha side.

planning:
  goal: |
    Rebuild the kiosk gesture controls so hand gestures drive the
    desk-companion UI: a wave arms the controller (timeout-gated),
    horizontal swipes cycle the kiosk panels, a held palm opens the
    settings drawer, and a downward drop dismisses overlays/panels.
    Detection runs on the shared YOLO/MoveNet pose keypoints — no
    second camera consumer.
  scope: |
    Delivered:
      - backend/gesture_controls.py — GestureController state machine
        (wave-to-arm with timeout + hysteresis, per-hand trajectory
        windows for swipe, palm-hold dwell, drop, per-gesture cooldown)
        and GestureService: subscribes pose_service.results(),
        persists the enabled flag via PostureStore monitor_state,
        fans events out to /ws/gesture subscribers.
      - backend/main.py — service construction + start/stop lifecycle,
        /ws/gesture (snapshot on connect, then live events),
        GET /api/gestures status, PATCH /api/gestures toggle
        (422 on non-boolean).
      - frontend — gesture-status chip + gesture-toggle checkbox in
        settings; app.js connectGestureSocket with reconnect,
        GESTURE_PANELS order, swipe/palm-hold/drop handlers driving
        existing panel machinery, REST toggle.
      - backend/tools.d/gesture_controls.py — ada-ha side tool:
        op=status (GET) and enable/disable (PATCH) against
        ADA_PI_URL (default http://idc02:8000); mutations go through
        the standard confirm gate; honest error when the companion is
        unreachable. manifest (policy read + internal per-action gate,
        secondary_allowed true), tool_guide entry, count_cap 114->115.
      - tests — test_gesture_controls.py (16 unit tests: wave-arm,
        swipe both directions, horizontal-dominance rejection,
        cooldown, drop/palm-hold, service lifecycle/status), frontend
        contract assertions, offline + live scenario yamls.
      - backend/tool_runner/__init__.py — latent bug fix: the
        confirmed/confirm_token envelope was popped by _execute_gated
        and re-injected only for NATIVE methods (signature check saw
        the tools.d _bound(**kwargs) wrapper, not spec.run), so
        confirmed=true resends could never reach a tools.d per-action
        gate. Now inspects dyn_spec.run — heals kanban's declared
        confirm params (dead since shipped) as well as this tool.
    Explicitly NOT done:
      - deploy/restart of ada-pi or ada-ha (forbidden for this task)
      - push/merge of the dispatch branch
      - gesture-driven pointer/cursor (separate card
        rebuild-gesture-pointer-with-yolo-732b0d already covered it)
  success_criteria:
    - 'wave arms the controller only with both-wrist confidence +
      raised-hand hysteresis; disarms after arm_timeout'
    - 'swipe requires horizontal dominance (rejects diagonal); emits
      exactly once per gesture (cooldown)'
    - 'kiosk: swipe cycles panels, palm-hold opens settings, drop
      dismisses; status chip + settings toggle reflect/persist state'
    - 'mutations confirm-gated end-to-end through runner.execute
      (needs_confirm -> confirmed=true/token executes)'
    - 'companion unreachable -> ok:false honest error, no invented state'
    - 'tool-lint clean, scenario yaml green, focused + suite pytest
      green'
  risks:
    - 'PoseService stream cadence (~5fps) sets the floor for swipe
      detection windows; tuned constants live at the top of
      gesture_controls.py'
    - 'tools.d confirm re-injection now inspects spec.run — tools whose
      run() declares confirmed/confirm_token but relied on never
      receiving them would change behavior (kanban wants it; no other
      tools.d module declares the params)'
  resources:
    - pose stream: backend/posture.py PoseService.results() (shared
      CameraHub frame, no extra camera cost)
    - persistence: PostureStore.monitor_state["gesture_controls"]
    - ada-ha reach: ADA_PI_URL env (default http://idc02:8000)
  owner: tony
  estimated_duration: 1 session

