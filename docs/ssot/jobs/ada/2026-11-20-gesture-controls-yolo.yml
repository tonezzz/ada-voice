# Card: rebuild-gesture-controls-using-yolo-190356 (kanban). Dispatch
# 20261120-215246-rebuild-gesture-controls-using, runner tony-dell.
# Attempt 2 — attempt 1 (20261120-213624) exited nonzero with the same
