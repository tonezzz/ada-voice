summary: >
  Re-measured the card's 2026-10-14 findings against live usage.jsonl.
  The ada-dev whale has collapsed (28.7M in on dig day -> residual
  0-5.5M/day bursts of short Live scenario sessions). TEST-POLLUTION
  recurred after the conftest fix: a non-pytest runner wrote t-ctx rows
  daily 2026-10-17..11-09 (~4.36M fake in-tokens) because conftest only
  covers pytest. Closed the hole at the ledger: the implicit default
  path now persists only for lane-identified processes, plus an env pin
  in the polluting test module. Prompt-caching verdict: NOT
  implementable on the Live API (no cached_content in LiveConnectConfig,
  google-genai 2.23.0; upstream issue googleapis/python-genai#2102; zero
  `cached` tokens in 5 weeks of ledger rows) and NOT reachable through
  the LiteLLM gateway on the REST lane (/v1beta/cachedContents -> 404,
  probed live). REST text-mode calls already get Gemini implicit
  caching free (>=4096-token prefix; our ~19-25K static qualifies).

