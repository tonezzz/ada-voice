prompt_caching_verdict:
  live_api: >
    NOT SUPPORTED. types.LiveConnectConfig (google-genai 2.23.0, the
    deployed pin range >=1.0,<3.0) has no cached_content field —
    upstream feature request googleapis/python-genai#2102 open.
    session_resumption + context_window_compression (already enabled,
    32k/24k trigger/target) are the Live-side levers and are in place.
  rest_text_lane: >
    Implicit caching is automatic and free on Gemini 2.5+/3.x for
    prefixes >=2048/4096 tokens — the text-mode system_instruction +
    lane tool decls (~19-25K static) qualify, so repeated prefixes are
    already discounted upstream; nothing to implement. Explicit
    cachedContent is NOT reachable: the LiteLLM gateway
    (ADA_GEMINI_REST_BASE_URL=http://100.102.134.91:4000) answers 404
    on POST /v1beta/cachedContents (probed 2026-11-24 with the ada-dev
    virtual key — endpoint absent, litellm issue #29258 class); native
    /v1beta cachedContents CRUD + cached_content passthrough would be
    gateway work in the chaba repo, not ada-voice.
  implication: >
    Tony's 2026-10-27 answer ("implement prompt-caching") cannot be
    implemented literally on either transport today. The burn reduction
    that IS available already shipped: bench/scenario traffic moved off
    Live onto the REST text lane (BEN-0573, smoke 44/47 text), Live
    sessions got resumption + compression + rotation + tool budgets.
    Residual lever, if wanted: flip more full-tier scenarios to
    transport:text where audio isn't under test, or add the
    cachedContents route to the LiteLLM gateway (chaba-side card).

