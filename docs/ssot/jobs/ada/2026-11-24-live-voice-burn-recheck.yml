test_pollution:
  recurrence_evidence: >
    t-ctx rows resumed the day after the 10-14 conftest fix and ran
    daily through 2026-11-09: exactly 5 rows/day at ~08:20 UTC
    (30000+78365+80000+1234+56 = 189,655 in — test_context_budget.py's
    five _record_usage calls verbatim), lane="" (no ADA_INSTANCE_ID).
    Writer bypassed pytest (conftest sets ADA_USAGE_LOG=off); consistent
    with `python tests/test_context_budget.py` /
    `python -m unittest` style execution. Stopped after 11-09 (writer
    gone), but the hole remained open for any non-pytest invocation.
  fix: >
    backend/usage_tracker.py — UsageLedger.__init__ now resolves the
    implicit default (ADA_USAGE_LOG unset) to data/usage.jsonl ONLY
    when _default_lane() yields a lane (ADA_INSTANCE_ID set and valid).
