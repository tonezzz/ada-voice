invoke:
  tool:
    - "printer action=status [queue=<name>]"
    - "printer action=jobs [queue=<name>]"
    - "printer action=verify [queue=<name>] [target=<host>]"
    - >-
      printer action=repair op=release-job|retry-job|cancel-job
      queue=<name> job_id=<id> confirm=... confirm_token=...

env:
  ADA_CUPS_SSH: >-
    ssh target for the print host — backend/printer_client.py default
    tony-dell
  ADA_CUPS_HELPER: >-
    helper invocation on the print host — default
    'python3 ~/bin/ada-cups-helper.py' (installed there 2026-11-23;
    non-interactive ssh PATH skips ~/.local/bin so a full path is
    required; a sudoers-narrowed wrapper for lpadmin is a later
    operator step if retarget is approved)

verification:
  unit: "pytest tests/test_printer.py -x -q  # 25 passed"
  lint: "python3 scripts/tool-lint.py  # clean, 71 declared / cap 115"
  live_read: >-
    ssh tony-dell python3 ~/bin/ada-cups-helper.py status ->
    HP-2777 dnssd-resolved_ip 192.168.2.92, uuid ...b906fe, markers
    70/40; HP_DeskJet_2700 now ipp://192.168.2.92/ipp/print (probe ok,
    serial/uuid match, idle, accepting — retargeted 2026-11-23);
    HP_DeskJet_2700_series_05C516 (CUPS-auto driverless,
    ipps://HPE073E705C516.local) resolves -> .92 match
  live_repair: >-
    held job on dead queue: release -> processing, cancel -> removed;
    jobs HP_DeskJet_2700 -> []
  registry_eval: >-
    evaluate_status pre-retarget: HP-2777 match/follows_mdns;
    HP_DeskJet_2700 unreachable/stale_target + remediation hint.
    Post-retarget (2026-11-23): all three queues probe the verified
    device — no drift flags.

