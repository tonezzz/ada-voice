# SSOT Job: printer diagnostics + bounded single-job repair surface.
# Card: ada-printer-diagnostics-safe-repair (chaba kanban, ref ADA-1049).
# Dispatch 20261123-105454-use-the-existing-ada-document-, runner idc02
# (attempt 3 — attempts 1-2 on tony-omen died on provider exits, no
# code was ever pushed). Dispatch 20261123-140159, runner idc02
# (attempt 4) executed the approved queue retarget — Tony answered
# "proceed" on board request ipp-identity-verified-2026-11-23-via-ton-
# f51f78 at 13:59.

title: >-
  Ada diagnoses the HP DeskJet queue and repairs one verified job at a
  time — never shells, never cancel-all
subtitle: >-
  docs(action=print) stays scoped to archived pages; printer ops are a
  new canonical `printer` tool riding the SAME same-session
  confirmation gate. Live verification on tony-dell caught the card's
  own intel stale: the printer is at 192.168.2.92 (not .78) with UUID
  ...b906fe (card's ...b90fe6 is a transposition), and the default
  HP_DeskJet_2700 queue targeted the .75 wireless repeater until the
  approved 2026-11-23 retarget to .92.

planning:
  goal: |
    Extend the document-print lane into a safe printer surface:
    read-only status/jobs/verify plus a fixed-allowlist repair
    (release-job, retry-job, cancel-job) bound to one verified
    queue/job through Ada's existing confirm fingerprint. A narrow
    CUPS helper on the print host replaces any Ada SSH/root — Ada
    ships exactly {op, args} JSON over the established `ssh tony-dell`
    lane and never sees a shell. Identity drift is resolved by IPP
    probe (serial/uuid), never by trusting queue URIs.
  scope: |
    Delivered:
      - scripts/ada-cups-helper.py — print-host helper; ops =
        status/jobs/verify/release-job/retry-job/cancel-job/
        set-queue-uri. Resolves dnssd:// queue URIs via
        `avahi-browse -rtp _ipp._tcp`, probes IPP per queue,
        separates cups-host jobs from printer-internal Get-Jobs,
        and refuses set-queue-uri unless --expect-serial/--expect-uuid
        match the live probe (mismatch = no lpadmin, exit 1)
      - backend/printer_registry.yml — hp-deskjet-2700 identity
        (serial CN33BDZ0KS, uuid ...b906fe, mDNS
        HPE073E705C516.local, current ip .92 verified 2026-11-23,
        stale_targets .75 repeater/.74 mn01), queues,
        repair_allowlist, repair_guard
      - backend/printer_client.py — async ssh lane to the helper
        (ADA_CUPS_SSH/ADA_CUPS_HELPER env-overridable, 60s cap) +
        evaluate_status(): identity verdict, drift verdict
        (stale_target/follows_mdns), remediation hints
      - backend/tool_runner/printer.py — PrinterMixin: _status/_jobs/
        _verify/_repair; repair resolves the job against the LIVE
        queue listing only (no trust in caller job ids), runs the
        allowlist op, re-reads status, returns audit-shaped result
      - wiring: common.py PRINTER_TOOLS/PRINTER_REPAIRS gate +
        _CHANGE_LOG_TOOLS, __init__.py mixin + elif,
        realtime_provider.py declaration + claim-backing +
        actuation budget 1, tool_guide.yml, ssot.tool-surface.yml
        count_cap 114->115, tests/scenarios-live/printer_diag.yaml,
        tests/test_printer.py (25 tests)
    Explicitly NOT done:
      - production deploy — staging verification on idc02 only, per
        AGENTS.md deploy flow
      - arbitrary job ops — resume/retry/cancel are the whole
        allowlist; cancel-all and test-page do not exist in the
        helper or the tool schema
  success_criteria:
    - 'printer action=status returns per-queue state + accepting +
      live job ids + device probe (serial/uuid/ink) with source_host'
    - 'HP-2777 reports verdict match + follows_mdns; HP_DeskJet_2700
      reports unreachable + stale_target + remediation hint'
    - 'repair denies without confirm token; token binds exact args;
      job must exist in live queue listing; after is re-read'
    - 'helper rejects unknown ops, bad job ids, cancel-all, and
      retarget without identity match'
    - 'tool-lint clean; focused tests green; full suite green'
  risks:
    - 'DHCP may move the printer again — .92 is "current" not
      "static"; the dnssd queue + IPP verify are the durable truth'
    - 'printer-internal Get-Jobs reports device-side state that CUPS
      repair ops cannot reach — surface labels them origin:printer
      and repair refuses them'
  resources:
    - print-host lane: ssh tony-dell (key auth, existing)
    - helper contract: scripts/ada-cups-helper.py --help (JSON in/out)
    - registry: backend/printer_registry.yml
  owner: tony
  estimated_duration: 1 session

