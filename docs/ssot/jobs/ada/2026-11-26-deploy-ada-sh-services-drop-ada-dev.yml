title: >-
  Every ada-voice deploy restarted the retired ada-dev lab twin;
  SERVICES now drops ada-dev and keeps ada-kk-dev for the kk
  CMS-only bench lane
subtitle: >-
  scripts/deploy-ada.sh SERVICES default loses the `ada-dev` token
  (canon, this branch) and the installed copy on idc03
  ~/.local/bin/deploy-ada.sh is edited in place with a timestamped
  sibling backup. Same pattern as eaf4eba (ada-pi-pwa retirement).

planning:
  goal: |
    deploy-ada.sh's `systemctl --user restart $SERVICES` (and the
    /api/health drain loop) must never touch ada-dev again, while
    ada-kk-dev — the live kk CMS-only bench target on idc03:8009 —
    stays in the restart set so bench runs always execute current
    code.
  scope: |
    Delivered:
      - scripts/deploy-ada.sh (repo canon): SERVICES default drops
        `ada-dev ` — commit c1eae8c on the dispatch branch.
      - idc03 ~/.local/bin/deploy-ada.sh: timestamped backup
        deploy-ada.sh.bak-20261126-214010, then in-place sed of the
        SERVICES line only (diff vs checkout canon = exactly line 33).
    Explicitly NOT done:
      - ada-dev.service itself left active/running (disabled unit;
        stopping it is a separate retirement decision).
      - idc02's installed deploy-ada.sh untouched (staging host,
        out of card scope).
      - No deploy-ada.sh run — verification is static + unit-level.
  success_criteria:
    - 'SERVICES expansion on idc03 lists 8 units, no ada-dev,
      ada-kk-dev present, all active'
    - 'ada-kk-dev restarts cleanly and /api/health :8009 ok'
    - 'kk-bench-env.py --profile kk-cms-only --check exits 0 on idc03'
    - 'next deploy leaves ada-dev ActiveEnterTimestamp unchanged'
  risks:
    - 'Self-drift gate: installed copy now differs from the canon in
      idc03''s checkout until the dispatch branch lands on the ref
      idc03 fetches (dell local main) and the checkout ff''s — the
      next deploy-ada.sh run exits at gate 0 with "deploy script
      drifted from canonical — reinstall it" until then. Verified
      live: rc=1 before any mutation.'
    - 'dell local main (5da3cc0) and GitHub origin/main (f91b763)
      diverged 3/3 — idc03 deploys gate on dell''s main, which lacks
      the ada_capabilities 2b snapshot section. Pre-existing;
      flagged on the card.'
  resources:
    - "prior art: eaf4eba exclude retired PWA unit from deploys"
    - "bench tool: chaba scripts/ada/kk-bench-env.py (bench_profiles.kk-cms-only -> host idc03, env ada-kk-dev.env, port 8009, service ada-kk-dev.service)"
  owner: tony
  estimated_duration: 1 session

