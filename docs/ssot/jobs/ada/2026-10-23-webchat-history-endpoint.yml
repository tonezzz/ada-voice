    voice/unbound/no_persist exclusions, mirrored-turn no-relog.
  - tests/test_webchat.py — 3 new: /api/chat/history returns ordered
    turns + 422 on missing chat_id; webchat_deliver journals the push.
  - pytest tests/ -x -q — 1652 passed, 7 skipped (scratch venv:
    fastapi, httpx, pyyaml, pillow, qrcode, websockets, numpy, uvicorn).
  - python3 scripts/tool-lint.py — clean (61 pre-existing warnings).

followups:
  - Deploy via ~/.local/bin/deploy-ada.sh on idc03 (not done in
