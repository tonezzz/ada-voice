title: >-
  vcast gesture control with YOLO — detector-health honesty landed on
  main; MediaPipe->YOLO client replacement confirmed already shipped in
  chaba
subtitle: >-
  Card note: "Use YOLO instead of MediaPipe for hand-gesture tracking on
  vcast displays to keep device load low". Audit (carried from the
  canonical card's job doc 2026-11-26-vcast-yolo-hand-pointer.yml): the
  vcast/gesture client apps and yolo-gesture.service live in the chaba
  repo — vcast hand mode has been YOLO end-to-end since 2026-10-15
  (hand_yolov8n box-centre pointer). The ada-voice-side gap was that
  vcast_gesture(mode='hand') answered ok while the detector was dead;
  that fix is what this landing delivers.

planning:
  goal: |
    YOLO (not MediaPipe) drives hand-gesture tracking on vcast displays
    with low device load. In ada-voice scope: the tool surface must tell
    the truth about which detector backs mode='hand' and whether it is
    actually consuming the display's frame uplink.
  scope: |
    Landed (cherry-pick of dd8a928 + 3ca1ffc, clean onto 0a5dbd8):
      - backend/tool_runner/screens.py — _yolo_pointer_status() probes
        GET /pointer on ADA_YOLO_POINTER_URL (default
        http://tony-omen.taila0626a.ts.net:8785); vcast_gesture(mode='hand')
        returns detector {engine, online, enabled, sinks, present,
        grabbing, last_error} and warns when unreachable / POINTER_SINK
        empty / sinks can't reach the target screen (vcast:auto or
        vcast:<N> only — ws:// feeds gesture-relay, not vcast rooms).
      - backend/realtime_provider.py + backend/tool_guide.yml — 'hand'
        described as the YOLO hand-pointer, not MediaPipe.
      - tests/test_tool_runner.py — VcastGestureDetectorTests (7 tests).
      - docs/ssot/jobs/ada/2026-11-26-vcast-yolo-hand-pointer.yml — the
        full audit + model-eval trail from the canonical dispatch.
      - dispatch-outcome-20261126-130417-*.md — canonical outcome doc.
    Added this session:
      - tests/scenarios-live/vcast_gesture_ops.yaml — stale comment
        "hand=MediaPipe desk UX" corrected to the YOLO hand-pointer.
    Explicitly NOT done:
      - chaba-side edits (vcast/gesture app source, yolo-gesture
        service, /apps/gesture engine default) — different repo,
        outside this worktree
      - restarting yolo-gesture.service on tony-omen — host ops
      - push/merge/deploy — forbidden for this dispatch
  success_criteria:
    - 'mode=hand result carries detector health; unreachable detector
      warns instead of silent ok'
    - 'off/room modes unchanged — no probe, no detector key'
    - 'tool-lint clean; scenario schema clean; focused + suite pytest green'
  risks:
    - 'ADA_YOLO_POINTER_URL default points at tony-omen:8785 where the
      unit is currently down — warning path is the intended behaviour'
    - 'probe adds up to ~2s to a mode=hand call (to_thread, 2s timeout)'
  resources:
    - 'detector: chaba experiments/ultralytics-yolo-ha/server.py
      (hand_yolov8n.pt, POINTER_SINK, GET /pointer)'
    - 'client: chaba stacks/web/public/apps/{vcast,gesture}/'
  owner: tony
  estimated_duration: 1 session

