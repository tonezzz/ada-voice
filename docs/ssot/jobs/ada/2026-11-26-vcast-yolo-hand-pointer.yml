# SSOT Job: vcast gesture — YOLO hand-pointer audit + detector-health honesty.
# Card: rebuild-gesture-control-using-yolo-83cf4a (OPS-1436). Dispatch
# 20261126-130417, runner tony-macbook, repo ada-voice.
#
# The card asks to "replace MediaPipe hand tracking with a YOLO-based
# hand/gesture detection model in the client display app". Investigation
# showed the replacement already exists end-to-end in the chaba repo
# (stacks/web/public/apps + experiments/ultralytics-yolo-ha) — this job
# records the audit, the model evaluation, the live-state gap found, and
# the ada-voice-side honesty fix that keeps Ada from claiming a dead
# pipeline works.

title: >-
  vcast gesture control — MediaPipe->YOLO replacement audit; hand mode
  now reports detector-backend health instead of bare ok
subtitle: >-
  The vcast 'hand' gesture mode was already YOLO end-to-end (display
  uplink -> yolo-gesture.service hand_yolov8n -> {type:gesture} msgs).
  Live audit 2026-11-26: the detector service is down on every host, so
  hand mode published frames nobody consumed while vcast_gesture still
  answered ok. The tool now probes GET /pointer on the detector and
  warns when it is unreachable, sinkless, or routed to another screen.

planning:
  goal: |
    Replace MediaPipe hand tracking with YOLO for the display/vcast
    client: evaluate browser/edge-suitable models, integrate the
    inference pipeline, map gestures to display commands, keep latency
    real-time, verify detection + screen control.
  scope: |
    Audited (all in chaba repo, NOT ada-voice — this dispatch is
    confined to the ada-voice worktree):
      - stacks/web/public/apps/vcast/index.html — gesture {mode:hand}
        BUILT: camera uplink ~300ms, cursor from pushed gesture msgs,
        dwell 700ms = click, two hands = grab->pane zoom, corner QR ->
        /apps/gesture/?s=N&engine=yolo.
      - stacks/web/public/apps/gesture/index.html — wand with two
        engines: mediapipe (default, on-device Hand/Face/Pose
        landmarker) and yolo (bare camera uplink to input-bridge
        /frame screen=0 token=gesture-N at ~3.3fps).
      - experiments/ultralytics-yolo-ha/server.py — pointer mode:
        hand_yolov8n.pt single-class 'hand' detector, box centre =
        pointer (X mirror-flip), >=2 hands 3 frames = fist_start grab,
        gone edge > POINTER_GONE_MS, sinks vcast:N | vcast:auto |
        ws://relay | http POST; GET /pointer debug endpoint.
      - yolo-gesture.service — systemd template (port 8785), moved
        idc03 -> tony-omen 2026-10-20 with park mode (skips inference
        when no fresh gesture-N uplink).
      - In-browser ONNX eval (card explore-yolo-for-gesture-control-
        in-apps-8e27eb, merged chaba master 2026-11-26 as 41ef17d2ac90):
        /apps/eye/?det=yolo runs YOLO26n HaGRID 12-class gesture model
        fully in-browser via vendored onnxruntime-web@1.31.1 (WebGPU EP
        preferred, WASM fallback). Headless-Chrome verified; CPU-wasm
        bench p50 ~419ms/2.4fps vs MediaPipe ~103-116ms/~9fps (~4x
        slower); int8 dynamic-quant rejected (6.5x slower).
    Delivered in ada-voice:
      - backend/tool_runner/screens.py — _yolo_pointer_status() probes
        ADA_YOLO_POINTER_URL (default http://tony-omen.taila0626a.ts.net:8785)
        GET /pointer; vcast_gesture(mode='hand') now returns a detector
        block {engine, online, enabled, sinks, present, grabbing,
        last_error} and warns when the detector is unreachable,
        POINTER_SINK-empty, or its sinks can't reach the target screen
        (vcast:<N> pinned or vcast:auto only — ws:// feeds gesture-relay,
        not vcast rooms).
      - backend/realtime_provider.py + backend/tool_guide.yml —
        vcast_gesture description corrected: 'hand' is the YOLO
        hand-pointer, not MediaPipe.
      - tests/test_tool_runner.py — VcastGestureDetectorTests (7 tests:
        covering/offline/sinkless/wrong-screen/pinned-match/probe-skip/
        invalid-mode).
    Explicitly NOT done:
      - any edit to chaba (gesture/vcast app source, yolo-gesture
        service) — different repo, outside this worktree
      - restarting yolo-gesture.service on tony-omen (host ops, not a
        code change; flagged on the card)
      - deploy/push (forbidden for this dispatch)
  success_criteria:
    - 'mode=hand result carries detector health; unreachable detector
      produces an explicit warning instead of silent ok'
    - 'sink routing honesty: vcast:auto / vcast:<screen> pass clean;
      vcast:<other>, ws://, empty sinks warn'
    - 'off/room modes unchanged — no probe, no detector key'
    - 'tool-lint clean; test_tool_runner suite green'
  risks:
    - 'ADA_YOLO_POINTER_URL default points at tony-omen:8785 — the unit
      moved hosts once already (idc03->omen 2026-10-20); env override is
      the repoint path'
    - 'probe adds up to ~2s to a mode=hand call (to_thread, 2s timeout)'
  resources:
    - "detector: chaba experiments/ultralytics-yolo-ha/server.py
      (hand_yolov8n.pt, POINTER_SINK, GET /pointer)"
    - "client: chaba stacks/web/public/apps/{vcast,gesture}/"
    - "eval: chaba dispatch-wt-20261125-201656 (merged 41ef17d2ac90)"
  owner: tony
  estimated_duration: 1 session

