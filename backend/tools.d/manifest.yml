  # ada-tool-consolidation-merge-overlapping-615ba9 (2026-11-24): the four
  # writers (wp_post/cpt_post/place_report/wp_chat_page) shared one
  # backend door (wp_client -> boards.surf-thailand.com REST) and
  # collapsed into wp(action=post|record|place|chat_page); the old names
