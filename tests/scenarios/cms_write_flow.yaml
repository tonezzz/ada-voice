name: cms-write-flow
instance: tony
# CMS write coverage offline: the report-meta contract gate fires
# before the confirm handshake, the register-then-confirm publish
# lands in FakeMddb (verify-after-write via cms_read), the merge-only
# note path stays ungated, and delete stays confirmed.
steps:
  - set: {session_owner_identity: person.tony}

  # Blank report meta is rejected before a pending request can even
  # register — fix the call, don't ask for approval on a bad write.
  # Blank (not absent) fields on purpose: absent required args die at
  # the declared-schema layer ("call args rejected") when schemas load,
  # but reach the tool as "report meta contract" in stub-schema envs —
  # present-but-empty passes schema shape checks and always lands on
  # missing_publish_fields, so the expectation holds in both.
  - tool: cms_publish_page
    args:
      slug: bench-report
      title: "Bench Report"
      content: "# hi"
      summary: ""
      domain: ""
      fresh_for: ""
      confidence: ""
    expect: {error_contains: "report meta contract"}

  # Full contract + no confirmed — the request registers and the
  # denial asks for the spoken yes.
  - tool: cms_publish_page
    args:
      slug: bench-report
      title: "Bench Report"
      content: "# Bench\noffline coverage body."
      summary: "offline bench coverage proof"
      domain: dev
      fresh_for: 1d
      confidence: unverified
    expect: {error_contains: "requires confirmation"}

  # confirmed=true on a slug that never registered is denied — the
  # pending request binds the exact publish.
  - tool: cms_publish_page
    args:
      slug: other-report
      title: "Other"
      content: "# x"
      summary: "s"
      domain: dev
      fresh_for: 1d
      confidence: low
      confirmed: true
    expect: {error_contains: "no pending request"}

  # The confirmed resubmit publishes — verify-after-write echoes the
  # stored excerpt.
  - tool: cms_publish_page
    args:
      slug: bench-report
      title: "Bench Report"
      content: "# Bench\noffline coverage body."
      summary: "offline bench coverage proof"
      domain: dev
      fresh_for: 1d
      confidence: unverified
      confirmed: true
    expect:
      output_contains:
        - '"status": "published"'
        - '"slug": "bench-report"'
        - '"stored_verified": true'

  # The page is really readable back. key= is the declared arg — the
  # slug= alias only survives when schema validation is off.
  - tool: cms_read
    args: {action: get, key: bench-report}
    expect:
      output_contains: ['Bench Report', 'offline coverage body']

  # The merge-only timeline note needs no confirmation.
  - tool: cms_edit
    args: {action: note, slug: bench-report,
           note: "follow-up: scenario re-ran clean"}
    expect: {output_contains: ['"status": "noted"']}

  # Delete stays confirm-gated.
  - tool: cms_edit
    args: {action: delete, slug: bench-report}
    expect: {error_contains: "requires confirmation"}
