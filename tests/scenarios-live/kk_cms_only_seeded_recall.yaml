# CMS-only memory experiment — deterministic seed, fresh session, recall
# from CMS only. Lane: ada-kk-dev @ ws://127.0.0.1:8009/ws with the
# kk-cms-only tool profile (bank/session-recall tools and web_search
# excluded — CMS is her only recall surface).
#
# The page is seeded OUT OF BAND by scenario-live.py's `seed:` block, not
# by asking the model to publish: earlier runs showed the publish+confirm
# dance is unreliable on this model, so it never actually tested recall.
# A failed seed exits INFRA (3), never a scored "recall" turn.
#
# 1. reconnect — fresh ws session; the ZETA page is the only intended
#    source for the answer.
# 2/3. Recall — require a cms_* read whose RESULT carries the seeded
#    content, plus the spoken pump detail.
name: kk_cms_only_seeded_recall
tier: full

seed:
  - collection: ada-cms-pages-kk-dev
    key: zeta-kk-cms-7741
    lang: en
    content_md: |
      Reference ZETA-KK-CMS-7741.
      The garden watering schedule is Mondays and Thursdays at 6am, and
      the pump must be primed first.
    meta:
      kind: report
      domain: home
      title: Garden watering schedule
      summary: Mondays and Thursdays at 6am; prime the pump first.

turns:
  - reconnect: {away_s: 2}

  - user: >-
      When is the garden watering scheduled, and what do I need to do
      before it runs?
    expect:
      calls_any: [cms_read, cms_get_page, cms_list_pages]
      no_successful_calls_except:
        - set_facial_expression
        - cms_read
        - cms_get_page
        - cms_list_pages
        - cms_verify_page
      # Ground truth from the read's result — the answer came from the
      # seeded page, not from the earlier conversation.
      result_contains_any: ["ZETA-KK-CMS-7741", "primed", "ปั๊ม"]
      response_contains_any: [prime, primed, ล่อน้ำ, ปั๊ม]
      timeout_s: 120
      settle_s: 5

  - user: >-
      Sorry, what was the watering schedule again?
    expect:
      calls_any: [cms_read, cms_get_page, cms_list_pages]
      no_successful_calls_except:
        - set_facial_expression
        - cms_read
        - cms_get_page
        - cms_list_pages
        - cms_verify_page
      result_contains_any: ["ZETA-KK-CMS-7741", "primed", "ปั๊ม"]
      response_contains_any: [prime, primed, ล่อน้ำ, ปั๊ม]
      timeout_s: 120

cleanup:
  mddb_delete:
    - {collection: ada-cms-pages-kk-dev, contains: "ZETA-KK-CMS-7741", langs: [en, th]}
