# CMS-only memory experiment — deterministic seed, fresh session, recall
# from CMS only. Lane: ada-kk-dev @ ws://127.0.0.1:8009/ws with the
# kk-cms-only tool profile (bank/session-recall tools and web_search
# excluded — CMS is her only recall surface).
#
# The page is seeded OUT OF BAND by scenario-live.py's `seed:` block, not
# by asking the model to publish: earlier runs showed the publish+confirm
# dance is unreliable on this model. `seed_evict:` removes old pages on the
# same topic first — the October `garden-watering-schedule` page was being
# read instead of the seed and produced a "Tuesday" answer.
#
# Assertions reflect what is actually claimed:
#   - FIRST recall must read CMS and carry the seeded content in the result.
#   - REPEAT ask may use retained session context; it must still be correct
#     (pump + Monday/Thursday, never Tuesday). It is not a second tool test.
name: kk_cms_only_seeded_recall
tier: full

seed_evict:
  - {collection: ada-cms-pages-kk-dev, key: garden-watering-schedule, langs: [en, th]}
  - {collection: ada-cms-pages-kk-dev, key: watering-schedule, langs: [en, th]}
  - {collection: ada-cms-pages-kk-dev, key: zeta-kk-cms-7741, langs: [en, th]}

seed:
  - collection: ada-cms-pages-kk-dev
    key: zeta-kk-cms-7741
    lang: en
    content_md: |
      Reference ZETA-KK-CMS-7741.
      The garden watering schedule is Mondays and Thursdays at 6am, and
      the pump must be primed first.
    meta:
      kind: report
      domain: home
      title: Garden watering schedule
      summary: Mondays and Thursdays at 6am; prime the pump first.

turns:
  - reconnect: {away_s: 2}

  - user: >-
      When is the garden watering scheduled, and what do I need to do
      before it runs?
    expect:
      # Proof this answer came from CMS, not context.
      calls_any: [cms_read, cms_get_page, cms_list_pages]
      no_successful_calls_except:
        - set_facial_expression
        - cms_read
        - cms_get_page
        - cms_list_pages
        - cms_verify_page
      result_contains_any: ["ZETA-KK-CMS-7741", "primed", "ปั๊ม"]
      response_contains_all_any:
        - ["prime", "primed", "ปั๊ม", "ล่อน้ำ"]
        - ["monday", "จันทร์"]
        - ["thursday", "พฤหัส"]
      response_not_contains: ["tuesday", "อังคาร"]
      timeout_s: 120
      settle_s: 5

  - user: >-
      Sorry, what was the watering schedule again?
    expect:
      # A repeat in the SAME session may use retained context — do not
      # require a second cms_read. Still catch the known day-name slip.
      no_successful_calls_except:
        - set_facial_expression
        - cms_read
        - cms_get_page
        - cms_list_pages
        - cms_verify_page
      response_contains_all_any:
        - ["prime", "primed", "ปั๊ม", "ล่อน้ำ"]
        - ["monday", "จันทร์"]
        - ["thursday", "พฤหัส"]
      response_not_contains: ["tuesday", "อังคาร"]
      response_nonempty: true
      timeout_s: 120

cleanup:
  mddb_delete:
    - {collection: ada-cms-pages-kk-dev, contains: "ZETA-KK-CMS-7741", langs: [en, th]}
