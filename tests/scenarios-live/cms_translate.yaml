name: cms-translate
tier: smoke
transport: text
# CMS translate — Ada creates a disposable EN page, publishes a TH variant,
# then a DE variant. lang accepts any BCP-47-ish tag since card
# open-ada-cms-tool-lang-arg-beyond-en-th-37f8a0 (was whitelisted to
# en/th in the tool schema + runner).
#
# Pass conditions for the German turns: she must actually call
# cms_publish_page (the 2026-09-27 phantom-pending-claim lie is still the
# failure mode to watch) and the write must land with a 'de*' lang tag.
#
# Read/write: real CMS writes to one disposable slug; cleanup deletes
# all three lang variants.
#
# Run on idc01:  python3 scripts/scenario-live.py \
#   tests/scenarios-live/cms_translate.yaml --url ws://127.0.0.1:8002/ws \
#   --api-key "$ADA_API_KEY"

turns:
  # --- seed EN page ------------------------------------------------------
  - user: >-
      Create a CMS page with slug "translate-probe", title "Translate
      Probe", content "This page exists to test translation. It has one
      sentence."
    expect:
      calls_any: [cms_publish_page]
      timeout_s: 90
      settle_s: 10
      # first publish registers pending — she must ask confirmation
  - user: Yes, publish it.
    expect:
      calls_any: [cms_publish_page]
      timeout_s: 90
      settle_s: 10

  # --- Thai variant ------------------------------------------------------
  - user: >-
      Now translate translate-probe into Thai and publish it as the Thai
      variant of the same page.
    expect:
      calls_any: [cms_publish_page]
      max_calls: 6
      timeout_s: 120
      settle_s: 10
      # pending gate again — slug:th is a different pending key than :en
  - user: Yes, publish the Thai version.
    expect:
      calls_any: [cms_publish_page]
      # tool_result events hold a Python-repr dict (single quotes, ≤300
      # chars) — _safe_args() stringifies nested dicts. Match 'lang': 'th'.
      result_contains: ["'lang': 'th'"]
      timeout_s: 90
      settle_s: 10

  # --- verify the TH variant is readable ---------------------------------
  # NOTE: "show me" can legitimately route to tv_action (casts the page).
  # Asking to fetch+read forces cms_get_page so the th doc is verified.
  - user: Fetch the Thai variant of translate-probe and tell me what it says.
    expect:
      calls_any: [cms_get_page]
      result_contains: ["'lang': 'th'"]
      response_nonempty: true
      timeout_s: 60
      settle_s: 8

  # --- German variant ------------------------------------------------------
  # OBSERVED 2026-09-27: with web_search rate-limited (429, free tier),
  # Ada claimed "I've registered your request for the German variant"
  # WITHOUT calling cms_publish_page — a phantom pending claim. Watch for
  # this class of lie; 'de' is a legal lang now, so a real publish must
  # show up as a cms_publish_page call + a tool_result carrying the tag.
  - user: Now make a German version of translate-probe too.
    expect:
      calls_any: [cms_publish_page]
      max_calls: 6
      timeout_s: 120
      settle_s: 10
      # pending gate again — slug:de is a different pending key than :en/:th
  - user: Yes, go ahead.
    expect:
      calls_any: [cms_publish_page]
      # tool_result carries the stored lang — 'de' or a regional tag like
      # 'de-de' are both correct outcomes.
      result_contains_any: ["'lang': 'de'", "'lang': 'de-"]
      timeout_s: 90
      settle_s: 10

cleanup:
  mddb_delete:
    - {collection: ada-cms-pages, key: "translate-probe",
       langs: [en, th, de, de-de]}
